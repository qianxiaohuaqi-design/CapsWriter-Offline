<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CapsWriter V1｜控制中心交互原型 R1</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#1e293b;background:#f5f6f8;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}.topbar{height:80px;display:flex;justify-content:space-between;align-items:center;background:white;border-bottom:1px solid #e2e8f0;padding:8px 32px;gap:16px}.brand{font-size:29px;font-weight:800;display:flex;align-items:center;gap:14px;color:#0f172a}.logo{width:48px;height:48px;display:grid;place-items:center;color:#fff;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#e47b11);font-size:22px}.top-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.pill{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:100px;padding:8px 13px;font-size:12px;color:#475569}.dot{width:9px;height:9px;display:inline-block;margin-right:7px;background:#d97706;border-radius:50%}.dot.ready{background:#10b981}.button{border:1px solid #cbd5e1;border-radius:9px;padding:10px 14px;background:#fff;color:#334155;font-weight:650}.button:hover{border-color:#f59e0b}.button.primary{background:#d97706;color:#fff;border-color:#d97706}.button.ghost{background:transparent;border:0}.button.danger{color:#b91c1c;border-color:#fecaca}.button:disabled{opacity:.5;cursor:not-allowed}.wrap{display:flex;align-items:stretch;gap:24px;padding:24px;max-width:1570px;margin:auto;height:calc(100vh - 80px)}aside{width:256px;flex:none;background:#e9edf2;border:1px solid #d6dce5;border-radius:17px;padding:13px;align-self:flex-start;max-height:100%;overflow:auto}.aside-title{color:#64748b;font-size:12px;font-weight:700;padding:14px}.nav{display:flex;align-items:center;width:100%;text-align:left;gap:11px;border:0;border-radius:11px;padding:13px 14px;background:transparent;color:#475569;margin-bottom:3px}.nav.active{background:#fff;color:#a16207;font-weight:750;border-left:3px solid #d97706;box-shadow:0 1px 3px #00000008}.nav:hover{background:#fff}.nav span:first-child{width:21px;text-align:center;font-size:17px}main{background:#fff;border:1px solid #e2e8f0;border-radius:17px;box-shadow:0 2px 9px #00000006;padding:30px;flex:1;min-width:0;overflow:auto}.heading{border-bottom:1px solid #e2e8f0;padding-bottom:20px;margin-bottom:22px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.heading h1{margin:0 0 8px;font-size:23px;color:#0f172a}.sub{color:#64748b;font-size:13px;margin:0;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin:12px 0}.card.white{background:#fff}.card h3{font-size:16px;margin:0 0 8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.small{font-size:12px;color:#64748b}.tag{font-size:12px;border-radius:6px;padding:5px 9px;background:#fef3c7;color:#92400e;font-weight:650}.tag.ok{background:#d1fae5;color:#065f46}.tag.warn{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.bar{height:8px;border-radius:50px;background:#f1e5d1;overflow:hidden}.bar>div{background:#e6a23c;height:100%;width:0;transition:width .2s}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tabs button.active{background:#fef3c7;border-color:#f59e0b;color:#92400e}.steps{display:flex;gap:5px;margin:16px 0}.steps span{flex:1;height:7px;border-radius:50px;background:#e2e8f0}.steps span.done{background:#d97706}.notice{background:#fffbeb;border:1px solid #fde68a;padding:13px 16px;border-radius:10px;color:#78350f;line-height:1.5}.muted{color:#64748b}label{display:flex;gap:8px;align-items:center;margin-top:10px}.footer-note{font-size:12px;color:#64748b;margin-top:20px;border-top:1px solid #e2e8f0;padding-top:13px}hr{border:0;border-top:1px solid #e2e8f0;margin:18px 0}textarea{width:100%;min-height:100px;border:1px solid #cbd5e1;border-radius:10px;padding:11px;resize:vertical}.spaced{margin:16px 0}.model{background:white;border:1px solid #e2e8f0;padding:14px;border-radius:12px;margin-top:9px}.model .name{font-weight:700}.checkbox{accent-color:#d97706}button:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}@media(max-width:920px){.wrap{height:auto;min-height:calc(100vh - 80px);display:block;padding:12px}aside{width:100%;max-height:none;display:flex;overflow:auto;gap:5px;margin-bottom:12px}.aside-title{display:none}.nav{white-space:nowrap;width:auto;margin:0}main{padding:18px;min-height:590px}.topbar{height:auto;min-height:72px;padding:10px 15px}.brand{font-size:22px}.top-right{gap:6px}.grid{grid-template-columns:1fr}}
</style></head><body>
<header class="topbar"><div class="brand"><span class="logo">◉</span>CapsWriter</div><div class="top-right"><span class="pill" id="headerStatus"></span><button class="button ghost" onclick="render()">⟳ 刷新示意</button><button class="button ghost" onclick="alert('仅展示原型。真实软件使用说明仍位于现有控制中心。')">ⓘ 帮助</button></div></header>
<div class="wrap"><aside id="sidebar"><div class="aside-title">⚙ 系统设置导航</div></aside><main id="panel" aria-live="polite"></main></div>
<script>
const nav=[['general','⚙','通用与交互'],['data','▤','本地数据管理'],['ai','✦','AI 润色与角色'],['hot','≡','热词与替换规则'],['model','◉','语音识别与硬件'],['file','▣','字幕转写'],['service','♡','服务与诊断'],['backup','▥','配置备份与迁移']];
const steps=[['欢迎与环境检查','检查系统、存储和已有模型。检测失败时仍可继续。'],['选择模型','显示有证据的推荐模型，并允许查看其他候选。'],['下载与安装','模型下载、内容校验和安装是三个独立阶段。'],['麦克风测试','必须由用户主动开始试录；不默认上传或保存音频。'],['听写快捷键','沿用既有按住/单击模式与输出偏好。'],['开始使用','只有真实模型与听写客户端就绪时才显示可听写。']];
const messages={missing:['尚未安装语音模型','进入模型中心安装或导入。'],downloading:['正在下载语音模型','示例进度 42%，尚未校验和安装。'],loading:['正在加载语音模型','模型文件可用，Worker 尚未准备好。'],ready:['语音输入已就绪','模型与客户端都已就绪（本页为模拟）。'],failed:['语音识别暂不可用','加载失败，不允许使用旧的就绪状态。']};
let state={page:'general',status:'missing',wizard:-1,edited:false,result:'今天我们继续完善 CapsWriter 的 V1 设计。',task:'waiting'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function btn(t,fn,cl=''){return '<button class="button '+cl+'" onclick="'+fn+'">'+t+'</button>'}
function card(title,body,opts=''){return '<section class="card '+opts+'"><h3>'+title+'</h3>'+body+'</section>'}
function heading(title,desc,actions=''){return '<div class="heading"><div><h1>'+title+'</h1><p class="sub">'+desc+'</p></div><div class="actions">'+actions+'</div></div>'}
function switchPage(p){state.page=p;state.wizard=-1;render()}
function setStatus(x){state.status=x;render()}
function wizardStart(){state.wizard=0;render()}
function wizardMove(d){state.wizard=Math.max(0,Math.min(5,state.wizard+d));render()}
function wizardExit(){state.wizard=-1;state.page='general';render()}
function statusDemo(){return '<div class="tabs">'+[['missing','无模型'],['downloading','下载中'],['loading','加载中'],['ready','已就绪'],['failed','加载失败']].map(([s,t])=>btn(t,"setStatus('"+s+"')",state.status===s?'active':'')).join('')+'</div>'}
function content(){
 if(state.wizard>=0){const st=steps[state.wizard];return heading('首次使用向导','交互原型：六步流程，不执行真实下载、检测或保存。',btn('稍后设置','wizardExit()'))+'<div class="steps">'+steps.map((_,i)=>'<span class="'+(i<=state.wizard?'done':'')+'"></span>').join('')+'</div>'+card('第 '+(state.wizard+1)+' / 6 步 · '+st[0],'<p>'+st[1]+'</p>'+ (state.wizard===2?'<div class="bar"><div style="width:42%"></div></div><p class="small">模拟下载进度 42% · 并非真实下载</p>':'')+(state.wizard===3?'<p class="notice">麦克风测试仅为步骤说明。此原型不会请求系统麦克风权限。</p>':''))+'<div class="actions">'+btn('返回上一步','wizardMove(-1)')+btn(state.wizard===5?'完成并查看控制中心':'下一步',state.wizard===5?'wizardExit()':'wizardMove(1)','primary')+btn('稍后设置','wizardExit()')+'</div>'; }
 if(state.page==='general')return heading('通用与交互','保留原有快捷键、对讲模式、声波浮层及输入行为。',btn('首次配置向导','wizardStart()'))+card('快捷键与对讲交互','<div class="row"><span>当前触发快捷键</span><b>Caps Lock（示意）</b></div><label><input class="checkbox" type="checkbox" checked disabled>开启长按对讲模式（仅示意）</label>')+card('听写状态反馈','<div class="row"><span>声波胶囊浮层</span><span class="tag ok">沿用</span></div><p class="small">新增规则：正在录音、正在识别、模型未就绪须准确区分。</p>')+card('结果确认浮层','<textarea oninput="state.edited=true;document.getElementById(\'editFlag\').textContent=\'已编辑，自动关闭暂停\'">'+esc(state.result)+'</textarea><div class="row"><span class="small" id="editFlag">'+(state.edited?'已编辑，自动关闭暂停':'未编辑时按既有设置关闭')+'</span><span class="small">只演示文本输入，不执行粘贴</span></div>');
 if(state.page==='model'){const [title,desc]=messages[state.status];return heading('语音识别与硬件','现有位置扩展模型中心功能，高级 ASR / ONNX / GPU 设置保留。',btn('打开首次向导','wizardStart()'))+statusDemo()+card('当前识别模型', '<div class="row"><b>'+title+'</b><span class="tag '+(state.status==='ready'?'ok':state.status==='failed'?'warn':'')+'">'+(state.status==='ready'?'就绪':'未就绪')+'</span></div><p class="sub">'+desc+'</p>'+(state.status==='downloading'?'<div class="bar"><div style="width:42%"></div></div><p class="small">42%（模拟）</p>':'')+'<div class="actions">'+btn('安装/查看模型','setStatus(\'downloading\')','primary')+btn('模拟加载','setStatus(\'loading\')')+btn('模拟就绪','setStatus(\'ready\')')+'</div>')+card('模型库（候选）',[['SenseVoice-Small','基础入门候选'],['Fun-ASR-Nano','进阶候选'],['Qwen3-ASR','需区分变体'],['Paraformer','兼容保留']].map(x=>'<div class="model"><div class="row"><span class="name">'+x[0]+'</span><span class="small">'+x[1]+'</span></div></div>').join(''))+card('识别与硬件高级设置','识别语言、ONNX Provider、GGUF/GPU、格式化参数保留在原设置区，待源码实际实现。');
 }
 if(state.page==='service'){const [title,desc]=messages[state.status];return heading('服务与诊断','真实产品应使用统一状态源，而不是仅凭 PID / 端口宣称已就绪。')+statusDemo()+card('当前运行状态','<div class="row"><b>'+title+'</b><span class="tag '+(state.status==='ready'?'ok':state.status==='failed'?'warn':'')+'">'+(state.status==='ready'?'可以听写':'需要检查')+'</span></div><p class="sub">'+desc+'</p>')+'<div class="grid">'+card('ASR 服务端','<p class="small">进程在线不能直接等于模型就绪</p>','white')+card('模型 Worker','<p class="small">当前会话：'+(state.status==='ready'?'就绪':state.status==='missing'?'无模型':'未就绪')+'</p>','white')+card('听写客户端','<p class="small">须验证实际连接与快捷键</p>','white')+card('软件维护','<p class="small">检查更新和安全手动升级指引（待实施）</p>','white')+'</div>'+card('服务操作','启动缺失组件、分别重启 ASR/客户端、日志入口、完全退出等旧功能保留。');
 }
 if(state.page==='file')return heading('字幕转写','原有单文件、批量、输出格式、TXT + JSON 重建 SRT 全部保留。')+card('添加音视频文件','<div class="row"><span>此原型不会访问本机文件</span>'+btn('模拟加入任务','state.task=\'waiting\';render()')+'</div>')+card('任务列表','<div class="row"><b>课程录屏.mp4（示例）</b><span class="tag">'+({waiting:'排队中',running:'转写中',done:'已完成',cancelled:'已取消'}[state.task])+'</span></div><div class="actions">'+btn('模拟开始','state.task=\'running\';render()')+btn('模拟完成','state.task=\'done\';render()')+btn('模拟取消','state.task=\'cancelled\';render()','danger')+'</div>')+card('字幕修复','TXT + JSON → 生成独立版本的 SRT；原始媒体与既有文件不能被覆盖。');
 if(state.page==='data')return heading('本地数据管理','保留历史搜索、日记、录音、转写输出与日志管理。')+card('输入历史','可搜索、复制和查看原始/最终文本。清空历史不删除日记和录音。')+card('录音与日记','独立管理，清理前明确显示具体影响范围。')+card('清理数据','需要单独预览和确认，不与卸载应用混为一谈。');
 if(state.page==='ai')return heading('AI 润色与角色','本地离线听写不要求填写在线 AI API。')+card('默认 AI 润色','启用前由用户配置 API 档案，告知在线 AI 将发送所处理的文字。')+card('API 档案与角色','保留服务商、模型、触发词、系统提示词、绑定及独立输出浮层。')+card('处理失败','在线调用失败时保留原始 ASR 结果，不静默改成直接写入。');
 if(state.page==='hot')return heading('热词与替换规则','保留热词/正则文本编辑、阈值、启用开关和备份。')+card('热词与规则编辑','<textarea readonly>CapsWriter | Caps Rider\nSenseVoice-Small</textarea><p class="small">无效规则显示行号；外部文件已修改则提示冲突。</p>');
 if(state.page==='backup')return heading('配置备份与迁移','保留导入、导出、自动备份及历史版本恢复。')+card('导入前变更预览','<label><input type="checkbox" checked class="checkbox">通用和模型设置</label><label><input type="checkbox" checked class="checkbox">热词与替换规则</label><label><input type="checkbox" checked class="checkbox">AI 档案结构与角色</label><p class="small">无真实文件；不会应用任何配置。</p>')+card('默认不导出的内容','API Key、录音、个人历史、日记、模型文件和日志。');
 return '';
}
function render(){
 document.getElementById('sidebar').innerHTML='<div class="aside-title">⚙ 系统设置导航</div>'+nav.map(([id,ic,t])=>'<button class="nav '+(state.page===id&&state.wizard<0?'active':'')+'" onclick="switchPage(\''+id+'\')"><span>'+ic+'</span>'+t+'</button>').join('');
 document.getElementById('headerStatus').innerHTML='<span class="dot '+(state.status==='ready'?'ready':'')+'"></span>'+esc(messages[state.status][0])+' · 演示';
 document.getElementById('panel').innerHTML=content()+'<p class="footer-note">交互原型 R1 · 依据远端源码和设计草案构建 · 不执行真实录音、下载、文件修改、安装、服务重启或诊断 · 未经用户冻结</p>';
}
render();
</script></body></html>
